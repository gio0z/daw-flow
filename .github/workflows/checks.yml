name: Checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    working-directory: deterministic-agentic-workflow

jobs:
  validation:
    name: ${{ matrix.os }} / Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-15-intel, windows-latest]
        python-version: ["3.10", "3.14"]
    steps:
      - name: Check out suite
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: deterministic-agentic-workflow
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Run regression tests
        run: python -m unittest discover -s tests -p "test_*.py"
      - name: Validate package contracts
        run: python scripts/validate.py package --format json
      - name: Validate suite integrity
        run: python scripts/route.py --check-suite --format json
