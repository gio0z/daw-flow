name: Checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    working-directory: deterministic-agentic-workflow

jobs:
  validation:
    name: ${{ matrix.os }} / Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-15-intel, windows-latest]
        python-version: ["3.10", "3.14"]
    steps:
      - name: Check out suite
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: deterministic-agentic-workflow
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Run regression tests
        run: python -m unittest discover -s tests -p "test_*.py"
      - name: Validate package contracts
        run: python scripts/validate.py package --format json
      - name: Validate suite integrity
        run: python scripts/route.py --check-suite --format json
      - name: Validate flow mapping
        run: python scripts/validate.py flow --project-root . --format json
      - name: Validate project config
        if: runner.os != 'Windows'
        run: python scripts/validate.py config AGENTS.md --project-root . --format json
      - name: Run route evaluation fixture
        run: python tools/evaluation/route_eval.py tools/evaluation/route_eval_fixture.json
      - name: Smoke test installer and unified CLI
        run: python -c "import json, pathlib, subprocess, sys, tempfile; ver = pathlib.Path('VERSION').read_text(encoding='utf-8').strip(); d = tempfile.TemporaryDirectory(); p = d.name; r1 = subprocess.run([sys.executable, 'scripts/daw.py', '--version'], check=True, capture_output=True, text=True); assert ver in r1.stdout; r2 = subprocess.run([sys.executable, 'scripts/install.py', 'install', '--agent', 'codex', '--scope', 'project', '--project-root', p, '--no-aliases', '--json'], check=True, capture_output=True, text=True); assert json.loads(r2.stdout)['status'] == 'installed'; r3 = subprocess.run([sys.executable, 'scripts/install.py', 'status', '--agent', 'codex', '--scope', 'project', '--project-root', p, '--json'], check=True, capture_output=True, text=True); assert json.loads(r3.stdout)['status'] == 'ready'; r4 = subprocess.run([sys.executable, 'scripts/install.py', 'uninstall', '--agent', 'codex', '--scope', 'project', '--project-root', p, '--json'], check=True, capture_output=True, text=True); assert json.loads(r4.stdout)['status'] == 'removed'; d.cleanup()"
